<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>quoridor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23F0EBE0'/><circle cx='16' cy='16' r='9' fill='%23C4A56E' stroke='%23A8894F' stroke-width='1.5'/></svg>">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FAF8F4">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4;
    --board-bg: #F0EBE0;
    --board-border: #D4CFC4;
    --groove: #DDD8CD;
    --groove-hover: #C4A56E55;
    --wall: #C4A56E;
    --wall-edge: #A8894F;
    --pawn-light: #F0DDB8;
    --pawn-light-edge: #CEBB8E;
    --pawn-dark: #5C3A1E;
    --pawn-dark-edge: #3D2510;
    --pawn-red: #C06040;
    --pawn-red-edge: #8E4030;
    --pawn-teal: #3A6B6B;
    --pawn-teal-edge: #264848;
    --highlight: #C4A56E44;
    --highlight-strong: #C4A56E88;
    --text: #2C2C2C;
    --text-light: #9C9688;
    --text-mid: #6B665C;
    --accent: #C03020;
    --cell-size: 48px;
    --groove-w: 10px;
  }

  html[data-theme="dark"] {
    --bg: #2E2A24;
    --board-bg: #3B362D;
    --board-border: #4F483D;
    --groove: #4A453C;
    --groove-hover: #C4A56E44;
    --highlight: #C4A56E44;
    --highlight-strong: #C4A56E77;
    --text: #EDE8DC;
    --text-light: #8A8477;
    --text-mid: #B3AD9F;
  }

  html, body { background: var(--bg); color: var(--text); transition: background 0.25s, color 0.25s; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background: var(--bg);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .player-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  .player-indicator.active { opacity: 1; }

  .player-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 1px 1px 3px #00000015;
  }

  .player-dot.light {
    background: radial-gradient(circle at 40% 35%, #FFF8EC, var(--pawn-light));
    border: 1px solid var(--pawn-light-edge);
  }
  .player-dot.dark {
    background: radial-gradient(circle at 40% 35%, #7A5535, var(--pawn-dark));
    border: 1px solid var(--pawn-dark-edge);
  }
  .player-dot.red {
    background: radial-gradient(circle at 40% 35%, #E08060, var(--pawn-red));
    border: 1px solid var(--pawn-red-edge);
  }
  .player-dot.teal {
    background: radial-gradient(circle at 40% 35%, #5A9B9B, var(--pawn-teal));
    border: 1px solid var(--pawn-teal-edge);
  }

  .wall-pips { display: flex; gap: 2px; }

  .wall-pip {
    width: 11px;
    height: 4px;
    background: var(--wall);
    border-radius: 1.5px;
    border: 0.5px solid var(--wall-edge);
    transition: opacity 0.3s;
  }

  .wall-pip.used { opacity: 0.15; }

  .board-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }

  .board-wrapper {
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 6px;
    padding: 8px;
    box-shadow: 0 2px 20px #00000008, 0 1px 4px #00000010;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, var(--cell-size));
    grid-template-rows: repeat(9, var(--cell-size));
    column-gap: var(--groove-w);
    row-gap: var(--groove-w);
    position: relative;
    background: var(--groove);
    border-radius: 3px;
  }

  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    background: var(--board-bg);
    position: relative;
    cursor: default;
    transition: background 0.15s;
    border-radius: 2px;
    z-index: 2;
  }

  .cell.legal-move { cursor: pointer; background: var(--highlight); }
  .cell.legal-move:active { background: var(--highlight-strong); }

  .pawn {
    position: absolute;
    width: 72%;
    height: 72%;
    top: 14%;
    left: 14%;
    border-radius: 50%;
    z-index: 20;
    transition: all 0.25s ease;
    box-shadow: 2px 2px 6px #00000020;
  }

  .pawn-light {
    background: radial-gradient(circle at 40% 35%, #FFF8EC 0%, var(--pawn-light) 60%, var(--pawn-light-edge) 100%);
    border: 1.5px solid var(--pawn-light-edge);
  }
  .pawn-dark {
    background: radial-gradient(circle at 40% 35%, #7A5535 0%, var(--pawn-dark) 60%, var(--pawn-dark-edge) 100%);
    border: 1.5px solid var(--pawn-dark-edge);
  }
  .pawn-red {
    background: radial-gradient(circle at 40% 35%, #E08060 0%, var(--pawn-red) 60%, var(--pawn-red-edge) 100%);
    border: 1.5px solid var(--pawn-red-edge);
  }
  .pawn-teal {
    background: radial-gradient(circle at 40% 35%, #5A9B9B 0%, var(--pawn-teal) 60%, var(--pawn-teal-edge) 100%);
    border: 1.5px solid var(--pawn-teal-edge);
  }

  .groove-zone {
    position: absolute;
    z-index: 3;
    cursor: pointer;
    border-radius: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .groove-zone:hover, .groove-zone:active { background: var(--groove-hover); }

  .wall-ghost {
    position: absolute;
    background: var(--wall);
    border: 1px solid var(--wall-edge);
    border-radius: 3px;
    z-index: 9;
    opacity: 0.45;
    pointer-events: none;
    animation: ghost-pulse 1s ease-in-out infinite;
  }

  @keyframes ghost-pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.65; }
  }

  .wall-placed {
    position: absolute;
    background: var(--wall);
    border: 1px solid var(--wall-edge);
    border-radius: 3px;
    z-index: 10;
    box-shadow: 1px 1px 3px #00000015;
    pointer-events: none;
  }

  /* Best-move hint (local mode): blue, to read distinctly from the
     gold walls and the red accent. */
  .cell.hint-cell {
    box-shadow: inset 0 0 0 3px #3B82C4;
    border-radius: 4px;
  }
  .wall-hint {
    position: absolute;
    background: #3B82C4;
    border: 1px solid #2C5F92;
    border-radius: 3px;
    z-index: 9;
    pointer-events: none;
    animation: ghost-pulse 1s ease-in-out infinite;
  }

  .action-bar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    flex-shrink: 0;
    background: var(--bg);
    border-top: 1px solid var(--board-border);
  }

  .action-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 10px 14px;
    min-height: 44px;
    background: var(--board-bg);
    border: 1.5px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-mid);
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .action-btn:active { background: var(--groove); }
  .action-btn:disabled { opacity: 0.3; pointer-events: none; }

  .winner-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(250, 248, 244, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .winner-overlay.show { opacity: 1; pointer-events: all; }
  .winner-overlay .player-dot { width: 56px; height: 56px; margin-bottom: 20px; }
  .winner-overlay h2 { font-size: 2.2rem; font-weight: 300; letter-spacing: 0.1em; margin-bottom: 6px; }
  .winner-overlay p { font-style: italic; color: var(--text-mid); margin-bottom: 28px; }
  .winner-overlay button {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    padding: 12px 32px;
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .winner-overlay button:active { background: var(--groove); }

  .error-flash {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    background: #C0302018;
    border: 1px solid #C0302040;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 10px 20px;
    border-radius: 8px;
    z-index: 150;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .error-flash.show { opacity: 1; }

  /* ── Share overlay seat list ── */
  .share-seat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
  }

  /* ── Nudge ── */
  .player-indicator {
    cursor: default;
    transition: opacity 0.3s, transform 0.2s;
  }
  .player-indicator.nudgeable { cursor: pointer; }
  .player-indicator.nudgeable:hover .player-dot { transform: scale(1.15); }
  .player-indicator.nudge-sent { animation: nudge-send 0.6s ease-out; }
  @keyframes nudge-send {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.25) rotate(-8deg); }
    60%  { transform: scale(1.1) rotate(6deg); }
    100% { transform: scale(1); }
  }
  .seat-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-light);
    margin-left: 4px;
    max-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seat-arrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    line-height: 1;
    color: var(--text-light);
    user-select: none;
  }
  .player-indicator.active .seat-arrow { color: var(--text); }

  #nudge-flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 3rem;
    font-style: italic;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 500;
    transition: opacity 0.2s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #nudge-flash.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #toast {
    position: fixed;
    bottom: calc(80px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--text);
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    padding: 9px 16px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 250;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  }
  #toast.show {
    opacity: 0.94;
    transform: translateX(-50%) translateY(0);
  }

  .info-btn {
    position: fixed;
    top: 10px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--board-border);
    background: var(--bg);
    color: var(--text-light);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 0.9rem;
    font-style: italic;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    padding-top: env(safe-area-inset-top);
  }
  .info-btn:active { background: var(--groove); }

  .info-panel {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(250, 248, 244, 0.97);
    z-index: 250;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .info-panel.show { opacity: 1; pointer-events: all; }

  .info-content { max-width: 400px; width: 100%; text-align: center; }
  .info-content h2 { font-size: 1.8rem; font-weight: 300; letter-spacing: 0.1em; margin-bottom: 20px; }
  .info-content p { font-size: 0.95rem; color: var(--text-mid); line-height: 1.7; margin-bottom: 12px; }

  .info-paths {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .info-path-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-mid);
  }

  .info-path-item .player-dot { width: 14px; height: 14px; }

  .info-path-num {
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .info-content button {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    padding: 10px 28px;
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    margin-top: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .info-content button:active { background: var(--groove); }

  /* ── Streamlined new-game grid ── */
  .new-game-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 14px;
    align-items: center;
    margin: 20px 0 12px;
    text-align: left;
  }
  .row-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-light);
    text-align: right;
  }
  .row-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .info-content button.game-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 8px 14px;
    background: var(--board-bg);
    border: 1.5px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-mid);
    transition: all 0.15s;
    margin-top: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .info-content button.game-btn:hover { border-color: var(--wall); color: var(--text); }
  .info-content button.game-btn:active { background: var(--groove); }

  .pawn-toggle {
    display: inline-flex;
    gap: 2px;
    border-left: 1px solid var(--board-border);
    padding-left: 8px;
  }
  .info-content button.pawn-choice {
    padding: 4px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.4;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 0;
    font-size: 1rem;
  }
  .info-content button.pawn-choice.active { opacity: 1; border-color: var(--wall); }
  .pawn-choice .player-dot { width: 14px; height: 14px; }

  .info-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--board-border);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
  }
  .info-footer a, .info-content .info-footer button {
    color: var(--text-light);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 2px 6px;
    margin-top: 0;
  }
  .info-footer a:hover, .info-content .info-footer button:hover { color: var(--text); }
  .info-footer .sep { color: var(--board-border); }
  .info-footer #btn-theme { font-size: 1rem; }

  @media (min-width: 768px) {
    .action-btn { font-size: 0.8rem; padding: 12px 18px; min-height: 48px; }
    .player-indicator { gap: 8px; }
  }
</style>
</head>
<body>

<div class="top-bar" id="top-bar"></div>

<div class="board-area">
  <div class="board-wrapper" id="board-wrapper">
    <div class="board" id="board"></div>
  </div>
</div>

<div class="action-bar" id="action-bar">
  <button class="action-btn" id="btn-wall-confirm" style="display:none; background:var(--wall); color:white; border-color:var(--wall-edge);">place wall</button>
  <button class="action-btn" id="btn-wall-cancel" style="display:none; color:var(--accent); border-color:var(--accent);">cancel</button>
  <button class="action-btn" id="btn-hint" style="display:none;">best move</button>
  <button class="action-btn" id="btn-hint-accept" style="display:none; background:#3B82C4; color:white; border-color:#2C5F92;">play it</button>
  <button class="action-btn" id="btn-hint-reject" style="display:none; color:var(--text-mid);">dismiss</button>
  <button class="action-btn" id="btn-undo">undo</button>
  <button class="action-btn" id="btn-new">new game</button>
  <button class="action-btn" id="btn-rotate">rotate: off</button>
</div>

<div class="winner-overlay" id="winner-overlay">
  <div class="player-dot" id="winner-dot"></div>
  <h2 id="winner-title"></h2>
  <p id="winner-sub"></p>
  <button id="btn-play-again">play again</button>
</div>

<div class="error-flash" id="error-flash"></div>

<!-- Share overlay for online rooms -->
<div class="winner-overlay" id="share-overlay" style="z-index:250;">
  <p style="color:var(--text-mid); font-style:italic; margin-bottom:16px;">share this link to play</p>
  <p id="share-link" style="font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--text); word-break:break-all; margin-bottom:16px; padding:10px 16px; background:var(--board-bg); border:1px solid var(--board-border); border-radius:6px; max-width:340px;"></p>
  <button id="share-copy-btn" onclick="copyShareLink()" style="font-family:'Cormorant Garamond',Georgia,serif; font-size:1rem; padding:10px 28px; background:var(--board-bg); border:1px solid var(--board-border); border-radius:6px; cursor:pointer; color:var(--text); margin-bottom:14px;">copy link</button>

  <div id="share-seats" style="display:flex; flex-direction:column; gap:6px; align-items:flex-start; margin:0 auto 14px; font-family:'DM Mono',monospace; font-size:0.78rem; color:var(--text);"></div>

  <div id="share-fill-ai" style="display:none; flex-direction:column; align-items:center; gap:8px; margin-bottom:14px;">
    <p style="font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--text-mid);">fill empty seats with computer</p>
    <div style="display:flex; gap:8px;">
      <button onclick="fillWithAi(1)" class="game-btn">easy</button>
      <button onclick="fillWithAi(2)" class="game-btn">medium</button>
      <button onclick="fillWithAi(3)" class="game-btn">hard</button>
    </div>
  </div>

  <button onclick="document.getElementById('share-overlay').classList.remove('show')" style="font-family:'DM Mono',monospace; font-size:0.7rem; padding:8px 16px; background:none; border:none; cursor:pointer; color:var(--text-light);">close</button>
</div>

<!-- Online status text -->
<div id="online-status" style="position:fixed; top:10px; left:12px; font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-light); z-index:50;"></div>

<!-- Nudge received flash -->
<div id="nudge-flash">poked!</div>
<button class="info-btn" id="btn-info">i</button>

<div class="info-panel" id="info-panel">
  <div class="info-content">
    <h2>quoridor</h2>
    <p style="font-size:0.9rem;">Move your pawn to the opposite side. Tap a cell to move, tap a groove to place a wall. Every player must always have a path to their goal.</p>
    <div class="info-paths" id="info-paths"></div>

    <div class="new-game-grid">
      <span class="row-label">local</span>
      <div class="row-buttons">
        <button id="btn-start-2" class="game-btn">2p</button>
        <button id="btn-start-4" class="game-btn">4p</button>
      </div>

      <span class="row-label">vs ai 2p</span>
      <div class="row-buttons">
        <button id="btn-ai-as-light" class="pawn-choice active" title="play as light"><span class="player-dot light"></span></button>
        <button id="btn-ai-as-dark" class="pawn-choice" title="play as dark"><span class="player-dot dark"></span></button>
      </div>

      <span class="row-label">vs ai 4p</span>
      <div class="row-buttons">
        <button id="btn-ai-as-0" class="pawn-choice" title="play as light"><span class="player-dot light"></span></button>
        <button id="btn-ai-as-1" class="pawn-choice" title="play as red"><span class="player-dot red"></span></button>
        <button id="btn-ai-as-2" class="pawn-choice" title="play as dark"><span class="player-dot dark"></span></button>
        <button id="btn-ai-as-3" class="pawn-choice" title="play as teal"><span class="player-dot teal"></span></button>
      </div>

      <span class="row-label">difficulty</span>
      <div class="row-buttons">
        <button id="btn-ai-easy" class="game-btn">easy</button>
        <button id="btn-ai-medium" class="game-btn">medium</button>
        <button id="btn-ai-hard" class="game-btn">hard</button>
      </div>

      <span class="row-label">online</span>
      <div class="row-buttons">
        <button id="btn-online-2" class="game-btn">2p</button>
        <button id="btn-online-4" class="game-btn">4p</button>
      </div>
    </div>

    <div class="info-footer">
      <a href="/how-it-thinks.html">how it thinks</a>
      <span class="sep">·</span>
      <a href="https://github.com/TomMHarris/quoridor" target="_blank">github</a>
      <span class="sep">·</span>
      <button id="btn-theme" title="Toggle dark mode">◐</button>
      <span class="sep">·</span>
      <button id="btn-info-close">close</button>
    </div>
  </div>
</div>

<script src="/ai.js"></script>
<script>
const BOARD = 9;
const PAWN_CLASSES = ["pawn-light", "pawn-dark", "pawn-red", "pawn-teal"];
const DOT_CLASSES = ["light", "dark", "red", "teal"];
const PLAYER_NAMES = ["light", "dark", "red", "teal"];
// 2-player colors: [light, dark]
// 4-player colors (clockwise: bottom, left, top, right): [light, red, dark, teal]
const FOUR_PLAYER_PAWN = ["pawn-light", "pawn-red", "pawn-dark", "pawn-teal"];
const FOUR_PLAYER_DOT = ["light", "red", "dark", "teal"];
const FOUR_PLAYER_NAME = ["light", "red", "dark", "teal"];
// Rotation: current player ends up at the bottom
// 2p: P0=0°, P1=180°
// 4p (bottom, left, top, right): P0=0°, P1=90°, P2=180°, P3=270°
const ROTATION_2P = [0, 180];
// CSS rotate is clockwise. To bring each seat's starting square to the bottom
// of the rotated view: bottom→stay (0°), left→bottom (270°), top→bottom (180°),
// right→bottom (90°).
const ROTATION_4P = [0, 270, 180, 90];

let numPlayers = 2;

function pawnClass(p) { return numPlayers === 4 ? FOUR_PLAYER_PAWN[p] : PAWN_CLASSES[p]; }
function dotClass(p) { return numPlayers === 4 ? FOUR_PLAYER_DOT[p] : DOT_CLASSES[p]; }
function playerName(p) { return numPlayers === 4 ? FOUR_PLAYER_NAME[p] : PLAYER_NAMES[p]; }
function rotationAngle(p) { return numPlayers === 4 ? ROTATION_4P[p] : ROTATION_2P[p]; }
let state = null;
let history = [];
let legalMoves = [];
let legalWalls = [];
let wallGhost = null;  // {wr, wc, orient} — confirmation preview (online or touch)
let hintMove = null;       // best-move suggestion (move object), or null
let hintThinking = false;  // true while the hint search is running
let hintUsesLeft = [];     // local hot-seat only: best-move uses remaining per seat (3 each)

// Detect touch devices (coarse pointer, no hover) — show wall confirmation
const isTouchDevice = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
let isRotated = false;
let autoRotate = false;
let shortestPaths = [];

// Computer opponent
let vsComputer = false;
let humanSeat = 0;     // the seat the human plays; AI controls all the others
let aiDepth = 2;       // 1=easy, 2=medium, 3=hard
let aiThinking = false;

// Online mode
let onlineMode = false;
let roomId = null;
let mySeat = null;
let playerToken = null;
let pollTimer = null;
let lastMoveCount = -1;
let seatInfo = [];           // [{seat, name, is_ai, occupied}, ...]
let onlineAiDepth = null;    // depth for AI seats in this room (null until host fills)
let hostSeat = 0;
let lastNudgeSeen = {};      // map seat → last timestamp we've shown a nudge for
let myDisplayName = "";
let onlineAiThinking = false;

function getPlayerToken() {
  let t = localStorage.getItem("quoridor_token");
  if (!t) { t = crypto.randomUUID(); localStorage.setItem("quoridor_token", t); }
  return t;
}

function getMyDisplayName() {
  if (!myDisplayName) myDisplayName = localStorage.getItem("quoridor_name") || "";
  return myDisplayName;
}

function setMyDisplayName(name) {
  myDisplayName = (name || "").trim().slice(0, 24);
  localStorage.setItem("quoridor_name", myDisplayName);
}

// ── API ──

async function apiCall(action, extra = {}) {
  try {
    const res = await fetch("/api/game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, history, num_players: numPlayers, ...extra }),
    });
    return await res.json();
  } catch (e) {
    return { error: "connection error" };
  }
}

async function roomApiCall(action, extra = {}) {
  try {
    const res = await fetch("/api/room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, player_token: playerToken, room_id: roomId, ...extra }),
    });
    return await res.json();
  } catch (e) {
    return { error: "connection error" };
  }
}

// ── Top bar (dynamic) ──

function buildTopBar() {
  const bar = document.getElementById("top-bar");
  bar.innerHTML = "";
  for (let p = 0; p < numPlayers; p++) {
    const indicator = document.createElement("div");
    indicator.className = "player-indicator";
    indicator.id = `p${p}-indicator`;
    // In online mode, every seat that's not me is pokeable
    if (onlineMode && p !== mySeat) {
      indicator.classList.add("nudgeable");
      indicator.title = "poke";
      indicator.addEventListener("click", () => sendNudge(p));
    }

    const dot = document.createElement("div");
    dot.className = `player-dot ${dotClass(p)}`;
    indicator.appendChild(dot);

    const arrow = document.createElement("span");
    arrow.className = "seat-arrow";
    arrow.id = `p${p}-arrow`;
    indicator.appendChild(arrow);

    const pips = document.createElement("div");
    pips.className = "wall-pips";
    pips.id = `p${p}-pips`;
    indicator.appendChild(pips);

    // Player name (online mode only)
    if (onlineMode) {
      const name = document.createElement("span");
      name.className = "seat-name";
      name.id = `p${p}-name`;
      indicator.appendChild(name);
    }

    bar.appendChild(indicator);
  }
  updateSeatNames();
  updateSeatArrows(state ? state.current_player : null);
}

function updateSeatNames() {
  if (!onlineMode) return;
  for (let p = 0; p < numPlayers; p++) {
    const el = document.getElementById(`p${p}-name`);
    if (!el) continue;
    const info = seatInfo[p];
    if (!info) { el.textContent = ""; continue; }
    if (info.is_ai) el.textContent = info.name || "AI";
    else if (info.occupied) el.textContent = (p === mySeat ? "you" : (info.name || "?"));
    else el.textContent = "(empty)";
  }
}

// ── Board ──

function buildBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < BOARD; r++) {
    for (let c = 0; c < BOARD; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener("click", () => onCellClick(r, c));
      board.appendChild(cell);
    }
  }
}

function buildGrooveZones() {
  document.querySelectorAll(".groove-zone").forEach(e => e.remove());
  const board = document.getElementById("board");
  const cells = board.querySelectorAll(".cell");
  if (!cells.length) return;

  const cellW = cells[0].offsetWidth;
  const cellH = cells[0].offsetHeight;
  const boardW = board.offsetWidth;
  const boardH = board.offsetHeight;
  const gapX = BOARD > 1 ? (boardW - BOARD * cellW) / (BOARD - 1) : 0;
  const gapY = BOARD > 1 ? (boardH - BOARD * cellH) / (BOARD - 1) : 0;

  for (let wr = 0; wr < 8; wr++) {
    for (let wc = 0; wc < 8; wc++) {
      // H zone
      const hz = document.createElement("div");
      hz.className = "groove-zone";
      hz.style.left = (wc * (cellW + gapX) + gapX / 2) + "px";
      hz.style.top = ((wr + 1) * cellH + wr * gapY) + "px";
      hz.style.width = (cellW * 2) + "px";
      hz.style.height = gapY + "px";
      hz.addEventListener("click", (e) => { e.stopPropagation(); onGrooveClick(wr, wc, "H"); });
      board.appendChild(hz);

      // V zone
      const vz = document.createElement("div");
      vz.className = "groove-zone";
      vz.style.left = ((wc + 1) * cellW + wc * gapX) + "px";
      vz.style.top = (wr * (cellH + gapY) + gapY / 2) + "px";
      vz.style.width = gapX + "px";
      vz.style.height = (cellH * 2) + "px";
      vz.addEventListener("click", (e) => { e.stopPropagation(); onGrooveClick(wr, wc, "V"); });
      board.appendChild(vz);

      // Cross-point
      const cross = document.createElement("div");
      cross.className = "groove-zone";
      cross.style.left = ((wc + 1) * cellW + wc * gapX) + "px";
      cross.style.top = ((wr + 1) * cellH + wr * gapY) + "px";
      cross.style.width = gapX + "px";
      cross.style.height = gapY + "px";
      cross.addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = cross.getBoundingClientRect();
        const fx = Math.abs((e.clientX - rect.left) / rect.width - 0.5);
        const fy = Math.abs((e.clientY - rect.top) / rect.height - 0.5);
        onGrooveClick(wr, wc, fy <= fx ? "H" : "V");
      });
      board.appendChild(cross);
    }
  }
}

// ── Rendering ──

function render() {
  if (!state) return;

  // Hints exist in local and vs-computer play, never online.
  if (hintMove && onlineMode) hintMove = null;

  document.querySelectorAll(".pawn, .wall-placed, .wall-ghost, .wall-hint").forEach(e => e.remove());
  document.querySelectorAll(".cell").forEach(e => e.classList.remove("legal-move", "hint-cell"));

  const board = document.getElementById("board");
  const cells = board.querySelectorAll(".cell");
  if (!cells.length) return;

  const cellW = cells[0].offsetWidth;
  const cellH = cells[0].offsetHeight;
  const boardW = board.offsetWidth;
  const gapX = BOARD > 1 ? (boardW - BOARD * cellW) / (BOARD - 1) : 0;
  const gapY = gapX;

  // Pawns
  const np = state.num_players || numPlayers;
  for (let p = 0; p < np; p++) {
    const [pr, pc] = state.pawns[p];
    const cell = getCell(pr, pc);
    if (cell) {
      const el = document.createElement("div");
      el.className = `pawn ${pawnClass(p)}`;
      cell.appendChild(el);
    }
  }

  // Walls
  for (const [wr, wc, orient] of state.walls) {
    renderWall(board, wr, wc, orient, "wall-placed", cellW, cellH, gapX, gapY);
  }

  // Ghost wall preview (online confirmation)
  if (wallGhost) {
    renderWall(board, wallGhost.wr, wallGhost.wc, wallGhost.orient, "wall-ghost", cellW, cellH, gapX, gapY);
  }

  // Best-move hint suggestion (local play)
  if (hintMove) {
    if (hintMove.type === "move") {
      const cell = getCell(hintMove.to[0], hintMove.to[1]);
      if (cell) cell.classList.add("hint-cell");
    } else {
      renderWall(board, hintMove.pos[0], hintMove.pos[1], hintMove.orient, "wall-hint", cellW, cellH, gapX, gapY);
    }
  }

  // Legal moves (hide when ghost active, AI's turn, or thinking)
  if (state.winner === null && !wallGhost && !(vsComputer && (state.current_player !== humanSeat || aiThinking))) {
    for (const m of legalMoves) {
      const cell = getCell(m[0], m[1]);
      if (cell) cell.classList.add("legal-move");
    }
  }

  updateWallPips();

  // Active player indicator
  for (let p = 0; p < np; p++) {
    const el = document.getElementById(`p${p}-indicator`);
    if (el) el.classList.toggle("active", state.current_player === p);
  }

  updateActionBar();
}

function renderWall(board, wr, wc, orient, className, cellW, cellH, gapX, gapY) {
  const el = document.createElement("div");
  el.className = className;
  const t = 10;
  if (orient === "H") {
    el.style.left = (wc * (cellW + gapX)) + "px";
    el.style.top = ((wr + 1) * cellH + wr * gapY + (gapY - t) / 2) + "px";
    el.style.width = (cellW * 2 + gapX) + "px";
    el.style.height = t + "px";
  } else {
    el.style.left = ((wc + 1) * cellW + wc * gapX + (gapX - t) / 2) + "px";
    el.style.top = (wr * (cellH + gapY)) + "px";
    el.style.width = t + "px";
    el.style.height = (cellH * 2 + gapY) + "px";
  }
  board.appendChild(el);
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function updateWallPips() {
  const np = state ? (state.num_players || numPlayers) : numPlayers;
  const totalWalls = np === 4 ? 5 : 10;
  for (let p = 0; p < np; p++) {
    const container = document.getElementById(`p${p}-pips`);
    if (!container) continue;
    container.innerHTML = "";
    const remaining = state ? state.walls_remaining[p] : totalWalls;
    for (let i = 0; i < totalWalls; i++) {
      const pip = document.createElement("div");
      pip.className = `wall-pip ${i >= remaining ? "used" : ""}`;
      container.appendChild(pip);
    }
  }
}

function updateActionBar() {
  const hasGhost = wallGhost !== null;
  const hasHint = hintMove !== null;

  // Hint availability by mode: vs-computer = unlimited on your own turn,
  // local hot-seat = 3 uses per player (count shown), online = never.
  let hintAvailable = false;
  let hintLabel = "best move";
  if (state && state.winner === null && !onlineMode) {
    if (vsComputer) {
      hintAvailable = state.current_player === humanSeat && !aiThinking;
    } else {
      const left = hintUsesLeft[state.current_player] || 0;
      hintAvailable = left > 0;
      hintLabel = `best move · ${left} left`;
    }
  }

  document.getElementById("btn-wall-confirm").style.display = hasGhost ? "" : "none";
  document.getElementById("btn-wall-cancel").style.display = hasGhost ? "" : "none";

  const hintBtn = document.getElementById("btn-hint");
  // Stay visible while thinking (shows "thinking…") even though the local
  // counter was just decremented and might otherwise hide the button.
  const showHint = hintThinking || (hintAvailable && !hasGhost && !hasHint);
  hintBtn.style.display = showHint ? "" : "none";
  hintBtn.disabled = hintThinking;
  hintBtn.textContent = hintThinking ? "thinking…" : hintLabel;
  document.getElementById("btn-hint-accept").style.display = hasHint ? "" : "none";
  document.getElementById("btn-hint-reject").style.display = hasHint ? "" : "none";

  const hideMisc = hasGhost || hasHint;
  document.getElementById("btn-undo").style.display = hideMisc || onlineMode ? "none" : "";
  document.getElementById("btn-undo").disabled = !state || state.move_count === 0;
  document.getElementById("btn-new").style.display = hideMisc ? "none" : "";
  document.getElementById("btn-rotate").style.display = hideMisc || onlineMode ? "none" : "";
}

// ── Interaction ──

function onCellClick(r, c) {
  if (!state || state.winner !== null || aiThinking) return;
  if (vsComputer && state.current_player !== humanSeat) return;
  if (wallGhost) { wallGhost = null; render(); return; }
  if (!legalMoves.some(m => m[0] === r && m[1] === c)) return;
  sendMove({ type: "move", to: [r, c] });
}

function onGrooveClick(wr, wc, orient) {
  if (!state || state.winner !== null || aiThinking) return;
  hintMove = null;  // starting a wall placement clears any suggestion
  if (vsComputer && state.current_player !== humanSeat) return;
  if (onlineMode && state.current_player !== mySeat) return;
  if (state.walls_remaining[state.current_player] <= 0) return;
  if (!legalWalls.some(w => w[0] === wr && w[1] === wc && w[2] === orient)) return;

  // Use ghost confirmation for online play and touch devices (phone/iPad)
  // where tiny groove lines are hard to target precisely.
  const needsConfirm = onlineMode || isTouchDevice;

  if (needsConfirm) {
    if (wallGhost && wallGhost.wr === wr && wallGhost.wc === wc && wallGhost.orient === orient) {
      confirmWall();  // tapping same ghost confirms
    } else {
      wallGhost = { wr, wc, orient };
      render();
    }
  } else {
    sendMove({ type: "wall", pos: [wr, wc], orient });
  }
}

function confirmWall() {
  if (!wallGhost) return;
  const move = { type: "wall", pos: [wallGhost.wr, wallGhost.wc], orient: wallGhost.orient };
  wallGhost = null;
  sendMove(move);
}

function cancelWall() {
  wallGhost = null;
  render();
}

// ── Best-move hint (local hot-seat) ──
//
// Runs the same client-side AI the computer opponent uses, at depth 3, on the
// current position for whoever is to move, then previews its choice. The player
// can play it or dismiss it. Search is synchronous, so we defer behind a paint
// to let the "thinking…" label show first.

function requestHint() {
  if (!state || state.winner !== null || hintThinking || hintMove) return;
  if (onlineMode) return;                                       // never in online play
  if (vsComputer) {
    if (state.current_player !== humanSeat || aiThinking) return;  // only on your own turn
  } else {
    // Local hot-seat: 3 uses per player. Consume one on request.
    if ((hintUsesLeft[state.current_player] || 0) <= 0) return;
    hintUsesLeft[state.current_player]--;
  }
  hintThinking = true;
  updateActionBar();
  setTimeout(() => {
    try {
      // Depth 6 in 2-player — two full plies deeper than the "hard" opponent.
      //
      // Only EVEN depths are used (the engine now steps 2, 4, 6): an odd depth
      // ends the search right after our own move, scoring the position before
      // the opponent can reply, which reads optimistically. That is why depth 5
      // measured *worse* than depth 4 in self-play. Stepping in twos means a
      // search cut short by the clock falls back to depth 4, never 5.
      //
      // 4-player is capped harder: with four pawns the tree is far wider — a
      // single depth-4 search there measured over a minute — so it gets depth 4
      // with a 15s ceiling and takes whatever depth fits.
      //
      // In 2-player the budget is deliberately generous so the clock does not
      // cut the search short: this is a "think hard for a few seconds" button.
      // The engine enforces the ceiling internally, so these are real limits.
      const twoPlayer = (state.num_players || 2) === 2;
      hintMove = AI.bestMove(state, twoPlayer ? 6 : 4, twoPlayer ? 90000 : 15000);
    } catch (e) {
      hintMove = null;
      showError("hint failed");
    }
    hintThinking = false;
    render();
  }, 30);
}

function acceptHint() {
  if (!hintMove) return;
  const move = hintMove;
  hintMove = null;
  sendMove(move);  // sendMove clears any lingering hint state too
}

function dismissHint() {
  hintMove = null;
  render();
}

// ── Rotation ──

// Current view angle (clockwise degrees) — how the board is rotated on screen.
function viewRotationAngle(player) {
  if (onlineMode && mySeat != null) return rotationAngle(mySeat) || 0;
  if (vsComputer) return rotationAngle(humanSeat) || 0;
  if (autoRotate && player != null) return rotationAngle(player) || 0;
  return 0;
}

// Direction arrow for each seat, taking the current view rotation into account.
// Absolute screen direction without any board rotation:
//   2p: P0 moves up (↑), P1 moves down (↓)
//   4p: P0 ↑, P1 → (left start), P2 ↓, P3 ← (right start)
const ARROW_RING = ["↑", "→", "↓", "←"];
function absArrowForSeat(p) {
  if (numPlayers === 2) return p === 0 ? "↑" : "↓";
  return ARROW_RING[p];  // 0↑ 1→ 2↓ 3←
}
function arrowForSeat(p, viewAngle) {
  const base = absArrowForSeat(p);
  const baseIdx = ARROW_RING.indexOf(base);
  const steps = Math.round(((viewAngle % 360) + 360) % 360 / 90);
  return ARROW_RING[(baseIdx + steps) % 4];
}
function updateSeatArrows(player) {
  const angle = viewRotationAngle(player);
  for (let p = 0; p < numPlayers; p++) {
    const el = document.getElementById(`p${p}-arrow`);
    if (el) el.textContent = arrowForSeat(p, angle);
  }
}

function applyRotation(player) {
  const wrapper = document.getElementById("board-wrapper");
  // Online mode: always show board from my perspective (my seat at the bottom)
  if (onlineMode && mySeat != null) {
    const angle = rotationAngle(mySeat) || 0;
    wrapper.style.transform = angle ? `rotate(${angle}deg)` : "";
    updateSeatArrows(player);
    return;
  }
  // Vs computer: lock to the human's perspective (their pawn at the bottom)
  if (vsComputer) {
    const angle = rotationAngle(humanSeat) || 0;
    wrapper.style.transform = angle ? `rotate(${angle}deg)` : "";
    updateSeatArrows(player);
    return;
  }
  // Local mode: rotate per turn if enabled
  if (!autoRotate) {
    wrapper.style.transform = "";
    updateSeatArrows(player);
    return;
  }
  const angle = rotationAngle(player) || 0;
  wrapper.style.transform = angle ? `rotate(${angle}deg)` : "";
  updateSeatArrows(player);
}

// ── API actions ──

async function sendMove(moveData) {
  hintMove = null;  // any pending suggestion is stale once a move is made
  if (onlineMode) {
    const json = await roomApiCall("move", { move: moveData });
    if (json.error) { showError(json.error); return; }
    applyRoomState(json);
    return;
  }

  const json = await apiCall("move", { move: moveData });
  if (json.error) {
    showError(json.error);
    return;
  }

  state = json.state;
  history = json.history;

  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];

  applyRotation(state.current_player);
  render();

  if (state.winner !== null) {
    setTimeout(() => showWinner(), 400);
  } else {
    tryAiMove();
  }
}

async function undoMove() {
  if (!state || state.move_count === 0) return;
  hintMove = null;
  const json = await apiCall("undo");
  if (json.error) { showError(json.error); return; }

  state = json.state;
  history = json.history;


  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];

  applyRotation(state.current_player);
  render();
}

async function newGame(np) {
  numPlayers = np || 2;
  vsComputer = false;
  aiThinking = false;
  hintMove = null;       // don't carry a suggestion into a fresh local game
  hintThinking = false;
  hintUsesLeft = Array(numPlayers).fill(3);   // 3 best-move uses per player
  document.getElementById("winner-overlay").classList.remove("show");

  buildTopBar();

  const json = await apiCall("new");
  if (json.error) { showError(json.error); return; }

  state = json.state;
  history = json.history;

  document.getElementById("board-wrapper").style.transform = "";

  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];
  render();
}

function showWinner() {
  const w = state.winner;
  document.getElementById("winner-dot").className = `player-dot ${dotClass(w)}`;
  document.getElementById("winner-title").textContent = `${playerName(w)} wins`;
  document.getElementById("winner-sub").textContent = `${state.move_count} moves`;
  document.getElementById("winner-overlay").classList.add("show");
}

let errorTimeout = null;
function showError(msg) {
  const el = document.getElementById("error-flash");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(errorTimeout);
  errorTimeout = setTimeout(() => el.classList.remove("show"), 2000);
}

// ── Info panel ──

function showInfo() {
  const container = document.getElementById("info-paths");
  container.innerHTML = "";
  const np = state ? (state.num_players || numPlayers) : numPlayers;
  for (let p = 0; p < np; p++) {
    const item = document.createElement("div");
    item.className = "info-path-item";
    item.innerHTML = `<div class="player-dot ${dotClass(p)}"></div>` +
      `<span class="info-path-num">${shortestPaths[p] != null ? shortestPaths[p] : "-"}</span>` +
      `<span>to goal</span>`;
    container.appendChild(item);
  }
  document.getElementById("info-panel").classList.add("show");
}

// ── Computer opponent ──

async function tryAiMove() {
  if (!vsComputer || aiThinking) return;
  if (!state || state.winner !== null) return;
  // The AI plays every seat that isn't the human's
  if (state.current_player === humanSeat) return;

  aiThinking = true;
  render(); // show no legal moves while AI thinks

  // Run AI in a setTimeout to let the UI update
  setTimeout(async () => {
    try {
      // Easy: 0-ply greedy that blocks when it's losing (AI.bestMoveEasy).
      // Medium: depth 2. Hard: depth 4 with iterative deepening.
      let move;
      if (aiDepth === 1) {
        move = AI.bestMoveEasy(state);
      } else {
        const maxDepth = aiDepth === 2 ? 2 : 4;
        const timeBudget = aiDepth === 2 ? 500 : 1800;
        move = AI.bestMove(state, maxDepth, timeBudget);
      }
      if (move) {
        aiThinking = false;
        await sendMove(move);
      } else {
        aiThinking = false;
        render();
      }
    } catch (e) {
      showError("AI error");
      aiThinking = false;
      render();
    }
  }, 50);
}

async function newGameVsComputer(depth, humanSeatIdx = 0, np = 2) {
  vsComputer = true;
  humanSeat = humanSeatIdx;
  aiDepth = depth;
  numPlayers = np;
  onlineMode = false;
  hintMove = null;       // vs-computer hints are unlimited; just clear any leftover
  hintThinking = false;

  document.getElementById("winner-overlay").classList.remove("show");
  buildTopBar();

  const json = await apiCall("new");
  if (json.error) { showError(json.error); return; }

  state = json.state;
  history = json.history;

  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];

  applyRotation(state.current_player);
  render();

  // If the human isn't on move, kick off the AI's first move
  if (state.current_player !== humanSeat) tryAiMove();
}

// ── Online multiplayer ──

function applyRoomState(json) {
  // Only clear a pending wall preview when the board actually advances.
  // "Unchanged" polls (changed:false, no state) carry no `state` and must
  // NOT wipe a placed-but-unconfirmed wall — otherwise the ghost vanishes on
  // the next 1.5s poll tick and you have to double-click to beat the timer.
  if (json.state) { wallGhost = null; state = json.state; }
  if (json.history) history = json.history;
  if (json.move_count != null) lastMoveCount = json.move_count;

  if (json.legal) {
    legalMoves = json.legal.pawn_moves || [];
    legalWalls = json.legal.legal_walls || [];
    shortestPaths = json.legal.shortest_paths || [];
  }

  if (json.seats) seatInfo = json.seats;
  if (json.ai_depth != null) onlineAiDepth = json.ai_depth;
  if (json.host_seat != null) hostSeat = json.host_seat;

  // Show share overlay state: waiting players only see it until status flips
  if (json.status === "waiting") {
    refreshShareOverlay();
  } else if (json.status === "playing") {
    document.getElementById("share-overlay").classList.remove("show");
  }

  // Check for incoming nudges (other seats nudged me).
  // On the very first poll after join, swallow any pre-existing nudge so we
  // don't flash for stale events. Subsequent polls show every newer nudge.
  if (json.nudges && mySeat != null) {
    const t = json.nudges[`seat_${mySeat}`];
    if (t && t > (lastNudgeSeen.me || 0)) {
      const alreadyBootstrapped = !!lastNudgeSeen.bootstrap;
      lastNudgeSeen.me = t;
      if (alreadyBootstrapped) {
        showNudgeReceived();
      }
    }
    lastNudgeSeen.bootstrap = true;
  }

  updateSeatNames();

  if (state) {
    applyRotation(state.current_player);
    render();
    updateOnlineStatus();

    if (state.winner !== null) {
      stopPolling();
      setTimeout(() => showWinner(), 400);
    } else {
      // If it's an AI seat's turn AND I am the host, play the move
      maybePlayAiMove();
    }
  }
}

function isAiSeat(seatIdx) {
  return seatInfo.some(s => s.seat === seatIdx && s.is_ai);
}

async function maybePlayAiMove() {
  if (!state || state.winner !== null) return;
  if (mySeat !== hostSeat) return;            // only the host runs the search
  if (!isAiSeat(state.current_player)) return;
  if (onlineAiThinking) return;
  if (!onlineAiDepth) return;

  onlineAiThinking = true;
  // small defer so the UI shows the new state first
  setTimeout(async () => {
    try {
      const depth = onlineAiDepth;
      let move;
      if (depth === 1) {
        move = AI.bestMoveEasy(state);
      } else {
        const maxD = depth === 2 ? 2 : 4;
        const budget = depth === 2 ? 500 : 1800;
        move = AI.bestMove(state, maxD, budget);
      }
      if (move) {
        const resp = await roomApiCall("move", { move });
        if (!resp.error) applyRoomState(resp);
      }
    } catch (e) {
      // swallow; another poll will retry
    }
    onlineAiThinking = false;
  }, 80);
}

function updateOnlineStatus() {
  const el = document.getElementById("online-status");
  if (!el || !onlineMode) return;
  if (!state) { el.textContent = ""; return; }
  if (state.winner !== null) { el.textContent = ""; return; }
  if (isAiSeat(state.current_player)) {
    el.textContent = "computer's turn";
  } else if (state.current_player === mySeat) {
    el.textContent = "your turn";
  } else {
    const name = (seatInfo[state.current_player] || {}).name;
    el.textContent = name ? `${name}'s turn` : "waiting...";
  }
}

async function createRoom(np) {
  playerToken = getPlayerToken();
  numPlayers = np;
  // Ask for a name (uses last-saved as default)
  const enteredName = window.prompt("Your name (visible to other players):", getMyDisplayName());
  if (enteredName === null) return;  // cancelled
  setMyDisplayName(enteredName);

  const json = await roomApiCall("create", { num_players: np, name: getMyDisplayName() });
  if (json.error) {
    if (json.error === "online_not_configured") showError("online not available");
    else showError(json.error);
    return;
  }

  roomId = json.room_id;
  mySeat = json.seat;
  onlineMode = true;
  numPlayers = json.num_players;
  lastNudgeSeen = {};

  // Update URL
  const url = new URL(window.location);
  url.searchParams.set("room", roomId);
  window.history.replaceState({}, "", url);

  buildTopBar();
  applyRoomState(json);
  showShareOverlay();
  startPolling();
}

async function joinRoom(id) {
  playerToken = getPlayerToken();
  roomId = id;
  // Prompt for name on join too
  const enteredName = window.prompt("Your name (visible to other players):", getMyDisplayName());
  if (enteredName !== null) setMyDisplayName(enteredName);

  const json = await roomApiCall("join", { name: getMyDisplayName() });
  if (json.error) {
    if (json.error === "room_not_found") showError("room not found");
    else if (json.error === "online_not_configured") showError("online not available");
    else showError(json.error);
    // Fall back to local
    newGame(2);
    return;
  }

  mySeat = json.seat;
  onlineMode = true;
  numPlayers = json.num_players;
  lastMoveCount = json.move_count || 0;
  lastNudgeSeen = {};

  buildTopBar();
  applyRoomState(json);

  if (json.status === "waiting") {
    showShareOverlay();
  }

  startPolling();
}

function showShareOverlay() {
  document.getElementById("share-overlay").classList.add("show");
  refreshShareOverlay();
}

function refreshShareOverlay() {
  const overlay = document.getElementById("share-overlay");
  if (!overlay.classList.contains("show")) return;
  const link = window.location.href;
  document.getElementById("share-link").textContent = link;

  // Render seat list
  const seatList = document.getElementById("share-seats");
  seatList.innerHTML = "";
  for (const s of seatInfo) {
    const row = document.createElement("div");
    row.className = "share-seat";
    const dot = document.createElement("span");
    dot.className = `player-dot ${dotClass(s.seat)}`;
    dot.style.width = "12px"; dot.style.height = "12px";
    row.appendChild(dot);
    const label = document.createElement("span");
    if (s.is_ai) {
      label.textContent = s.name || "AI";
    } else if (s.occupied) {
      label.textContent = s.name || "(joined)";
    } else {
      label.textContent = "(empty)";
      label.style.opacity = "0.5";
    }
    row.appendChild(label);
    seatList.appendChild(row);
  }

  // Show host "fill with AI" controls only to the host while waiting
  const fillRow = document.getElementById("share-fill-ai");
  const hasEmpty = seatInfo.some(s => !s.occupied);
  const amHost = mySeat === hostSeat;
  fillRow.style.display = (amHost && hasEmpty) ? "" : "none";
}

async function fillWithAi(depth) {
  const json = await roomApiCall("fill_ai", { ai_depth: depth });
  if (json.error) { showError(json.error); return; }
  applyRoomState(json);
}

async function copyShareLink() {
  try {
    await navigator.clipboard.writeText(window.location.href);
    document.getElementById("share-copy-btn").textContent = "copied!";
    setTimeout(() => { document.getElementById("share-copy-btn").textContent = "copy link"; }, 1500);
  } catch (e) {
    // Fallback: select the text
    const el = document.getElementById("share-link");
    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(pollRoom, 1500);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function pollRoom() {
  if (!onlineMode || !roomId) return;
  const json = await roomApiCall("poll", { last_move_count: lastMoveCount });
  if (json.error) return;

  // Always re-apply seat info / nudges / status (cheap), even if game state
  // didn't change. applyRoomState ignores absent fields.
  applyRoomState(json);
}

async function sendNudge(targetSeat) {
  if (!onlineMode) return;
  if (targetSeat === mySeat) return;  // can't nudge yourself
  const isAi = isAiSeat(targetSeat);
  const target = (seatInfo[targetSeat] || {}).name || "them";
  const indicator = document.getElementById(`p${targetSeat}-indicator`);
  if (indicator) {
    indicator.classList.add("nudge-sent");
    setTimeout(() => indicator.classList.remove("nudge-sent"), 600);
  }
  // Toast for the sender — confirmation the nudge fired
  showToast(isAi ? "poked ai (it won't care)" : `poked ${target}`);
  await roomApiCall("nudge", { target_seat: targetSeat });
}

let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

function showNudgeReceived() {
  const flash = document.getElementById("nudge-flash");
  if (!flash) return;
  flash.classList.remove("show");
  // force reflow to retrigger animation
  void flash.offsetWidth;
  flash.classList.add("show");
  setTimeout(() => flash.classList.remove("show"), 1500);
}

function leaveOnline() {
  stopPolling();
  onlineMode = false;
  roomId = null;
  mySeat = null;
  seatInfo = [];
  onlineAiDepth = null;
  lastNudgeSeen = {};
  const url = new URL(window.location);
  url.searchParams.delete("room");
  window.history.replaceState({}, "", url);
  document.getElementById("share-overlay").classList.remove("show");
  const statusEl = document.getElementById("online-status");
  if (statusEl) statusEl.textContent = "";
}

// ── Button handlers ──

document.getElementById("btn-wall-confirm").addEventListener("click", confirmWall);
document.getElementById("btn-wall-cancel").addEventListener("click", cancelWall);
document.getElementById("btn-hint").addEventListener("click", requestHint);
document.getElementById("btn-hint-accept").addEventListener("click", acceptHint);
document.getElementById("btn-hint-reject").addEventListener("click", dismissHint);
document.getElementById("btn-undo").addEventListener("click", undoMove);
document.getElementById("btn-new").addEventListener("click", showInfo);
document.getElementById("btn-play-again").addEventListener("click", () => {
  if (vsComputer) newGameVsComputer(aiDepth, humanSeat, numPlayers);
  else if (onlineMode) createRoom(numPlayers);
  else newGame(numPlayers);
});
document.getElementById("btn-start-2").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  leaveOnline();
  newGame(2);
});
document.getElementById("btn-start-4").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  leaveOnline();
  newGame(4);
});
document.getElementById("btn-online-2").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  createRoom(2);
});
document.getElementById("btn-online-4").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  createRoom(4);
});
// Pawn-colour choice for vs computer.
//   2-player: humanSeat = 0 (light, first) or 1 (dark, second)
//   4-player: humanSeat = 0..3 (clockwise: light/red/dark/teal)
// The AI takes every seat that isn't humanSeat.
let aiNumPlayers = 2;  // 2 or 4 — chosen via the info-panel UI

function updatePawnChoice() {
  // 2p toggle
  const lightBtn = document.getElementById("btn-ai-as-light");
  const darkBtn = document.getElementById("btn-ai-as-dark");
  if (lightBtn) lightBtn.classList.toggle("active", aiNumPlayers === 2 && humanSeat === 0);
  if (darkBtn) darkBtn.classList.toggle("active", aiNumPlayers === 2 && humanSeat === 1);
  // 4p four-color choice
  for (let i = 0; i < 4; i++) {
    const b = document.getElementById(`btn-ai-as-${i}`);
    if (b) b.classList.toggle("active", aiNumPlayers === 4 && humanSeat === i);
  }
}
document.getElementById("btn-ai-as-light").addEventListener("click", () => {
  aiNumPlayers = 2; humanSeat = 0; updatePawnChoice();
});
document.getElementById("btn-ai-as-dark").addEventListener("click", () => {
  aiNumPlayers = 2; humanSeat = 1; updatePawnChoice();
});
for (let i = 0; i < 4; i++) {
  document.getElementById(`btn-ai-as-${i}`).addEventListener("click", () => {
    aiNumPlayers = 4; humanSeat = i; updatePawnChoice();
  });
}

document.getElementById("btn-ai-easy").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  newGameVsComputer(1, humanSeat, aiNumPlayers);
});
document.getElementById("btn-ai-medium").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  newGameVsComputer(2, humanSeat, aiNumPlayers);
});
document.getElementById("btn-ai-hard").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  newGameVsComputer(3, humanSeat, aiNumPlayers);
});
document.getElementById("btn-info").addEventListener("click", showInfo);
document.getElementById("btn-info-close").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
});
// Click outside the info card closes the panel
document.getElementById("info-panel").addEventListener("click", (e) => {
  if (e.target.id === "info-panel") {
    e.target.classList.remove("show");
  }
});

// Theme toggle (light/dark)
(function initTheme() {
  const saved = localStorage.getItem("quoridor_theme");
  if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
})();
document.getElementById("btn-theme").addEventListener("click", () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  if (isDark) {
    document.documentElement.removeAttribute("data-theme");
    localStorage.setItem("quoridor_theme", "light");
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
    localStorage.setItem("quoridor_theme", "dark");
  }
});

document.getElementById("btn-rotate").addEventListener("click", () => {
  autoRotate = !autoRotate;
  document.getElementById("btn-rotate").textContent = autoRotate ? "rotate: on" : "rotate: off";
  if (state) {
    applyRotation(state.current_player);
    render();
  }
});

// ── Sizing ──

function recalcSize() {
  const topH = document.querySelector(".top-bar").offsetHeight || 44;
  const botH = document.querySelector(".action-bar").offsetHeight || 65;
  const availW = window.innerWidth - 28;
  const availH = window.innerHeight - topH - botH - 20;
  const cellSize = Math.floor(Math.min(availW / 10.6, availH / 10.6, 64));
  document.documentElement.style.setProperty("--cell-size", cellSize + "px");
  document.documentElement.style.setProperty("--groove-w", Math.max(8, Math.round(cellSize * 0.2)) + "px");
}

// ── Init ──

recalcSize();
buildBoard();
buildTopBar();
updateWallPips();

setTimeout(() => {
  buildGrooveZones();
  // Check URL for room parameter
  const urlParams = new URLSearchParams(window.location.search);
  const urlRoom = urlParams.get("room");
  if (urlRoom) {
    joinRoom(urlRoom);
  } else {
    newGame(2);
  }
}, 50);

window.addEventListener("resize", () => {
  recalcSize();
  buildGrooveZones();
  if (state) render();
});

// Service worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
