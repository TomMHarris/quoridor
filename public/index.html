<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>quoridor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4;
    --board-bg: #F0EBE0;
    --board-border: #D4CFC4;
    --groove: #DDD8CD;
    --groove-hover: #C4A56E55;
    --wall: #C4A56E;
    --wall-edge: #A8894F;
    --pawn-light: #F0DDB8;
    --pawn-light-edge: #CEBB8E;
    --pawn-dark: #5C3A1E;
    --pawn-dark-edge: #3D2510;
    --pawn-red: #C06040;
    --pawn-red-edge: #8E4030;
    --pawn-teal: #3A6B6B;
    --pawn-teal-edge: #264848;
    --highlight: #C4A56E44;
    --highlight-strong: #C4A56E88;
    --text: #2C2C2C;
    --text-light: #9C9688;
    --text-mid: #6B665C;
    --accent: #C03020;
    --cell-size: 48px;
    --groove-w: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background: var(--bg);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .player-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  .player-indicator.active { opacity: 1; }

  .player-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 1px 1px 3px #00000015;
  }

  .player-dot.light {
    background: radial-gradient(circle at 40% 35%, #FFF8EC, var(--pawn-light));
    border: 1px solid var(--pawn-light-edge);
  }
  .player-dot.dark {
    background: radial-gradient(circle at 40% 35%, #7A5535, var(--pawn-dark));
    border: 1px solid var(--pawn-dark-edge);
  }
  .player-dot.red {
    background: radial-gradient(circle at 40% 35%, #E08060, var(--pawn-red));
    border: 1px solid var(--pawn-red-edge);
  }
  .player-dot.teal {
    background: radial-gradient(circle at 40% 35%, #5A9B9B, var(--pawn-teal));
    border: 1px solid var(--pawn-teal-edge);
  }

  .wall-pips { display: flex; gap: 2px; }

  .wall-pip {
    width: 11px;
    height: 4px;
    background: var(--wall);
    border-radius: 1.5px;
    border: 0.5px solid var(--wall-edge);
    transition: opacity 0.3s;
  }

  .wall-pip.used { opacity: 0.15; }

  .board-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }

  .board-wrapper {
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 6px;
    padding: 8px;
    box-shadow: 0 2px 20px #00000008, 0 1px 4px #00000010;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, var(--cell-size));
    grid-template-rows: repeat(9, var(--cell-size));
    column-gap: var(--groove-w);
    row-gap: var(--groove-w);
    position: relative;
    background: var(--groove);
    border-radius: 3px;
  }

  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    background: var(--board-bg);
    position: relative;
    cursor: default;
    transition: background 0.15s;
    border-radius: 2px;
    z-index: 2;
  }

  .cell.legal-move { cursor: pointer; background: var(--highlight); }
  .cell.legal-move:active { background: var(--highlight-strong); }

  .pawn {
    position: absolute;
    width: 72%;
    height: 72%;
    top: 14%;
    left: 14%;
    border-radius: 50%;
    z-index: 20;
    transition: all 0.25s ease;
    box-shadow: 2px 2px 6px #00000020;
  }

  .pawn-light {
    background: radial-gradient(circle at 40% 35%, #FFF8EC 0%, var(--pawn-light) 60%, var(--pawn-light-edge) 100%);
    border: 1.5px solid var(--pawn-light-edge);
  }
  .pawn-dark {
    background: radial-gradient(circle at 40% 35%, #7A5535 0%, var(--pawn-dark) 60%, var(--pawn-dark-edge) 100%);
    border: 1.5px solid var(--pawn-dark-edge);
  }
  .pawn-red {
    background: radial-gradient(circle at 40% 35%, #E08060 0%, var(--pawn-red) 60%, var(--pawn-red-edge) 100%);
    border: 1.5px solid var(--pawn-red-edge);
  }
  .pawn-teal {
    background: radial-gradient(circle at 40% 35%, #5A9B9B 0%, var(--pawn-teal) 60%, var(--pawn-teal-edge) 100%);
    border: 1.5px solid var(--pawn-teal-edge);
  }

  .groove-zone {
    position: absolute;
    z-index: 3;
    cursor: pointer;
    border-radius: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .groove-zone:hover, .groove-zone:active { background: var(--groove-hover); }

  .wall-placed {
    position: absolute;
    background: var(--wall);
    border: 1px solid var(--wall-edge);
    border-radius: 3px;
    z-index: 10;
    box-shadow: 1px 1px 3px #00000015;
    pointer-events: none;
  }

  .action-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    flex-shrink: 0;
    background: var(--bg);
    border-top: 1px solid var(--board-border);
  }

  .action-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 10px 14px;
    min-height: 44px;
    background: var(--board-bg);
    border: 1.5px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-mid);
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .action-btn:active { background: var(--groove); }
  .action-btn:disabled { opacity: 0.3; pointer-events: none; }

  .winner-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(250, 248, 244, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .winner-overlay.show { opacity: 1; pointer-events: all; }
  .winner-overlay .player-dot { width: 56px; height: 56px; margin-bottom: 20px; }
  .winner-overlay h2 { font-size: 2.2rem; font-weight: 300; letter-spacing: 0.1em; margin-bottom: 6px; }
  .winner-overlay p { font-style: italic; color: var(--text-mid); margin-bottom: 28px; }
  .winner-overlay button {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    padding: 12px 32px;
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .winner-overlay button:active { background: var(--groove); }

  .error-flash {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    background: #C0302018;
    border: 1px solid #C0302040;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 10px 20px;
    border-radius: 8px;
    z-index: 150;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .error-flash.show { opacity: 1; }

  .info-btn {
    position: fixed;
    top: 10px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--board-border);
    background: var(--bg);
    color: var(--text-light);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 0.9rem;
    font-style: italic;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    padding-top: env(safe-area-inset-top);
  }
  .info-btn:active { background: var(--groove); }

  .info-panel {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(250, 248, 244, 0.97);
    z-index: 250;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .info-panel.show { opacity: 1; pointer-events: all; }

  .info-content { max-width: 400px; width: 100%; text-align: center; }
  .info-content h2 { font-size: 1.8rem; font-weight: 300; letter-spacing: 0.1em; margin-bottom: 20px; }
  .info-content p { font-size: 0.95rem; color: var(--text-mid); line-height: 1.7; margin-bottom: 12px; }

  .info-paths {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .info-path-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-mid);
  }

  .info-path-item .player-dot { width: 14px; height: 14px; }

  .info-path-num {
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .info-content button {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    padding: 10px 28px;
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    margin-top: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .info-content button:active { background: var(--groove); }

  @media (min-width: 768px) {
    .action-btn { font-size: 0.8rem; padding: 12px 18px; min-height: 48px; }
    .player-indicator { gap: 8px; }
  }
</style>
</head>
<body>

<div class="top-bar" id="top-bar"></div>

<div class="board-area">
  <div class="board-wrapper" id="board-wrapper">
    <div class="board" id="board"></div>
  </div>
</div>

<div class="action-bar" id="action-bar">
  <button class="action-btn" id="btn-undo">undo</button>
  <button class="action-btn" id="btn-new">new game</button>
  <button class="action-btn" id="btn-rotate">rotate: off</button>
</div>

<div class="winner-overlay" id="winner-overlay">
  <div class="player-dot" id="winner-dot"></div>
  <h2 id="winner-title"></h2>
  <p id="winner-sub"></p>
  <button id="btn-play-again">play again</button>
</div>

<div class="error-flash" id="error-flash"></div>
<button class="info-btn" id="btn-info">i</button>

<div class="info-panel" id="info-panel">
  <div class="info-content">
    <h2>quoridor</h2>
    <p>Move your pawn to the opposite side of the board. Tap a cell to move, tap a groove to place a wall.</p>
    <p>Walls block movement but every player must always have a path to their goal.</p>
    <div class="info-paths" id="info-paths"></div>
    <div style="margin: 16px 0 8px; display: flex; justify-content: center; gap: 10px;">
      <button id="btn-start-2" style="font-family:'DM Mono',monospace; font-size:0.72rem; padding:10px 18px; background:var(--board-bg); border:1.5px solid var(--board-border); border-radius:6px; cursor:pointer; color:var(--text-mid);">new 2 player</button>
      <button id="btn-start-4" style="font-family:'DM Mono',monospace; font-size:0.72rem; padding:10px 18px; background:var(--board-bg); border:1.5px solid var(--board-border); border-radius:6px; cursor:pointer; color:var(--text-mid);">new 4 player</button>
    </div>
    <button id="btn-info-close">close</button>
  </div>
</div>

<script>
const BOARD = 9;
const PAWN_CLASSES = ["pawn-light", "pawn-dark", "pawn-red", "pawn-teal"];
const DOT_CLASSES = ["light", "dark", "red", "teal"];
const PLAYER_NAMES = ["light", "dark", "red", "teal"];
// Rotation angles: each player's goal appears at the top
const ROTATION_ANGLES = [0, 180, 90, 270];

let numPlayers = 2;
let state = null;
let history = [];
let legalMoves = [];
let legalWalls = [];    // [[wr, wc, orient], ...]
let isRotated = false;
let autoRotate = false;
let shortestPaths = [];

// ── API ──

async function apiCall(action, extra = {}) {
  try {
    const res = await fetch("/api/game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, history, num_players: numPlayers, ...extra }),
    });
    return await res.json();
  } catch (e) {
    return { error: "connection error" };
  }
}

// ── Top bar (dynamic) ──

function buildTopBar() {
  const bar = document.getElementById("top-bar");
  bar.innerHTML = "";
  for (let p = 0; p < numPlayers; p++) {
    const indicator = document.createElement("div");
    indicator.className = "player-indicator";
    indicator.id = `p${p}-indicator`;

    const dot = document.createElement("div");
    dot.className = `player-dot ${DOT_CLASSES[p]}`;
    indicator.appendChild(dot);

    const pips = document.createElement("div");
    pips.className = "wall-pips";
    pips.id = `p${p}-pips`;
    indicator.appendChild(pips);

    bar.appendChild(indicator);
  }
}

// ── Board ──

function buildBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < BOARD; r++) {
    for (let c = 0; c < BOARD; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener("click", () => onCellClick(r, c));
      board.appendChild(cell);
    }
  }
}

function buildGrooveZones() {
  document.querySelectorAll(".groove-zone").forEach(e => e.remove());
  const board = document.getElementById("board");
  const cells = board.querySelectorAll(".cell");
  if (!cells.length) return;

  const cellW = cells[0].offsetWidth;
  const cellH = cells[0].offsetHeight;
  const boardW = board.offsetWidth;
  const boardH = board.offsetHeight;
  const gapX = BOARD > 1 ? (boardW - BOARD * cellW) / (BOARD - 1) : 0;
  const gapY = BOARD > 1 ? (boardH - BOARD * cellH) / (BOARD - 1) : 0;

  for (let wr = 0; wr < 8; wr++) {
    for (let wc = 0; wc < 8; wc++) {
      // H zone
      const hz = document.createElement("div");
      hz.className = "groove-zone";
      hz.style.left = (wc * (cellW + gapX) + gapX / 2) + "px";
      hz.style.top = ((wr + 1) * cellH + wr * gapY) + "px";
      hz.style.width = (cellW * 2) + "px";
      hz.style.height = gapY + "px";
      hz.addEventListener("click", (e) => { e.stopPropagation(); onGrooveClick(wr, wc, "H"); });
      board.appendChild(hz);

      // V zone
      const vz = document.createElement("div");
      vz.className = "groove-zone";
      vz.style.left = ((wc + 1) * cellW + wc * gapX) + "px";
      vz.style.top = (wr * (cellH + gapY) + gapY / 2) + "px";
      vz.style.width = gapX + "px";
      vz.style.height = (cellH * 2) + "px";
      vz.addEventListener("click", (e) => { e.stopPropagation(); onGrooveClick(wr, wc, "V"); });
      board.appendChild(vz);

      // Cross-point
      const cross = document.createElement("div");
      cross.className = "groove-zone";
      cross.style.left = ((wc + 1) * cellW + wc * gapX) + "px";
      cross.style.top = ((wr + 1) * cellH + wr * gapY) + "px";
      cross.style.width = gapX + "px";
      cross.style.height = gapY + "px";
      cross.addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = cross.getBoundingClientRect();
        const fx = Math.abs((e.clientX - rect.left) / rect.width - 0.5);
        const fy = Math.abs((e.clientY - rect.top) / rect.height - 0.5);
        onGrooveClick(wr, wc, fy <= fx ? "H" : "V");
      });
      board.appendChild(cross);
    }
  }
}

// ── Rendering ──

function render() {
  if (!state) return;

  document.querySelectorAll(".pawn, .wall-placed").forEach(e => e.remove());
  document.querySelectorAll(".cell").forEach(e => e.classList.remove("legal-move"));

  const board = document.getElementById("board");
  const cells = board.querySelectorAll(".cell");
  if (!cells.length) return;

  const cellW = cells[0].offsetWidth;
  const cellH = cells[0].offsetHeight;
  const boardW = board.offsetWidth;
  const gapX = BOARD > 1 ? (boardW - BOARD * cellW) / (BOARD - 1) : 0;
  const gapY = gapX;

  // Pawns
  const np = state.num_players || numPlayers;
  for (let p = 0; p < np; p++) {
    const [pr, pc] = state.pawns[p];
    const cell = getCell(pr, pc);
    if (cell) {
      const el = document.createElement("div");
      el.className = `pawn ${PAWN_CLASSES[p]}`;
      cell.appendChild(el);
    }
  }

  // Walls
  for (const [wr, wc, orient] of state.walls) {
    renderWall(board, wr, wc, orient, "wall-placed", cellW, cellH, gapX, gapY);
  }

  // Legal moves
  if (state.winner === null) {
    for (const m of legalMoves) {
      const cell = getCell(m[0], m[1]);
      if (cell) cell.classList.add("legal-move");
    }
  }

  updateWallPips();

  // Active player indicator
  for (let p = 0; p < np; p++) {
    const el = document.getElementById(`p${p}-indicator`);
    if (el) el.classList.toggle("active", state.current_player === p);
  }

  updateActionBar();
}

function renderWall(board, wr, wc, orient, className, cellW, cellH, gapX, gapY) {
  const el = document.createElement("div");
  el.className = className;
  const t = 10;
  if (orient === "H") {
    el.style.left = (wc * (cellW + gapX)) + "px";
    el.style.top = ((wr + 1) * cellH + wr * gapY + (gapY - t) / 2) + "px";
    el.style.width = (cellW * 2 + gapX) + "px";
    el.style.height = t + "px";
  } else {
    el.style.left = ((wc + 1) * cellW + wc * gapX + (gapX - t) / 2) + "px";
    el.style.top = (wr * (cellH + gapY)) + "px";
    el.style.width = t + "px";
    el.style.height = (cellH * 2 + gapY) + "px";
  }
  board.appendChild(el);
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function updateWallPips() {
  const np = state ? (state.num_players || numPlayers) : numPlayers;
  const totalWalls = np === 4 ? 5 : 10;
  for (let p = 0; p < np; p++) {
    const container = document.getElementById(`p${p}-pips`);
    if (!container) continue;
    container.innerHTML = "";
    const remaining = state ? state.walls_remaining[p] : totalWalls;
    for (let i = 0; i < totalWalls; i++) {
      const pip = document.createElement("div");
      pip.className = `wall-pip ${i >= remaining ? "used" : ""}`;
      container.appendChild(pip);
    }
  }
}

function updateActionBar() {
  document.getElementById("btn-undo").disabled = !state || state.move_count === 0;
}

// ── Interaction ──

function onCellClick(r, c) {
  if (!state || state.winner !== null) return;
  if (!legalMoves.some(m => m[0] === r && m[1] === c)) return;
  sendMove({ type: "move", to: [r, c] });
}

function onGrooveClick(wr, wc, orient) {
  if (!state || state.winner !== null) return;
  if (state.walls_remaining[state.current_player] <= 0) return;
  // Only allow legal wall placements
  if (!legalWalls.some(w => w[0] === wr && w[1] === wc && w[2] === orient)) return;
  sendMove({ type: "wall", pos: [wr, wc], orient });
}

// ── Rotation ──

function applyRotation(player) {
  if (!autoRotate) {
    document.getElementById("board-wrapper").style.transform = "";
    return;
  }
  const angle = ROTATION_ANGLES[player] || 0;
  document.getElementById("board-wrapper").style.transform = angle ? `rotate(${angle}deg)` : "";
}

// ── API actions ──

async function sendMove(moveData) {
  const json = await apiCall("move", { move: moveData });
  if (json.error) {
    showError(json.error);
    if (moveData.type === "wall") { wallGhost = null; render(); }
    return;
  }

  state = json.state;
  history = json.history;


  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];

  applyRotation(state.current_player);
  render();

  if (state.winner !== null) {
    setTimeout(() => showWinner(), 400);
  }
}

async function undoMove() {
  if (!state || state.move_count === 0) return;
  const json = await apiCall("undo");
  if (json.error) { showError(json.error); return; }

  state = json.state;
  history = json.history;


  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];

  applyRotation(state.current_player);
  render();
}

async function newGame(np) {
  numPlayers = np || 2;
  document.getElementById("winner-overlay").classList.remove("show");

  buildTopBar();

  const json = await apiCall("new");
  if (json.error) { showError(json.error); return; }

  state = json.state;
  history = json.history;

  document.getElementById("board-wrapper").style.transform = "";

  const legalJson = await apiCall("legal");
  legalMoves = legalJson.pawn_moves || [];
  legalWalls = legalJson.legal_walls || [];
  shortestPaths = legalJson.shortest_paths || [];
  render();
}

function showWinner() {
  const w = state.winner;
  document.getElementById("winner-dot").className = `player-dot ${DOT_CLASSES[w]}`;
  document.getElementById("winner-title").textContent = `${PLAYER_NAMES[w]} wins`;
  document.getElementById("winner-sub").textContent = `${state.move_count} moves`;
  document.getElementById("winner-overlay").classList.add("show");
}

let errorTimeout = null;
function showError(msg) {
  const el = document.getElementById("error-flash");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(errorTimeout);
  errorTimeout = setTimeout(() => el.classList.remove("show"), 2000);
}

// ── Info panel ──

function showInfo() {
  const container = document.getElementById("info-paths");
  container.innerHTML = "";
  const np = state ? (state.num_players || numPlayers) : numPlayers;
  for (let p = 0; p < np; p++) {
    const item = document.createElement("div");
    item.className = "info-path-item";
    item.innerHTML = `<div class="player-dot ${DOT_CLASSES[p]}"></div>` +
      `<span class="info-path-num">${shortestPaths[p] != null ? shortestPaths[p] : "-"}</span>` +
      `<span>to goal</span>`;
    container.appendChild(item);
  }
  document.getElementById("info-panel").classList.add("show");
}

// ── Button handlers ──

document.getElementById("btn-undo").addEventListener("click", undoMove);
document.getElementById("btn-new").addEventListener("click", () => newGame(numPlayers));
document.getElementById("btn-play-again").addEventListener("click", () => newGame(numPlayers));
document.getElementById("btn-start-2").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  newGame(2);
});
document.getElementById("btn-start-4").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
  newGame(4);
});
document.getElementById("btn-info").addEventListener("click", showInfo);
document.getElementById("btn-info-close").addEventListener("click", () => {
  document.getElementById("info-panel").classList.remove("show");
});

document.getElementById("btn-rotate").addEventListener("click", () => {
  autoRotate = !autoRotate;
  document.getElementById("btn-rotate").textContent = autoRotate ? "rotate: on" : "rotate: off";
  if (state) {
    applyRotation(state.current_player);
    render();
  }
});

// ── Sizing ──

function recalcSize() {
  const topH = document.querySelector(".top-bar").offsetHeight || 44;
  const botH = document.querySelector(".action-bar").offsetHeight || 65;
  const availW = window.innerWidth - 28;
  const availH = window.innerHeight - topH - botH - 20;
  const cellSize = Math.floor(Math.min(availW / 10.6, availH / 10.6, 64));
  document.documentElement.style.setProperty("--cell-size", cellSize + "px");
  document.documentElement.style.setProperty("--groove-w", Math.max(8, Math.round(cellSize * 0.2)) + "px");
}

// ── Init ──

recalcSize();
buildBoard();
buildTopBar();
updateWallPips();

setTimeout(() => {
  buildGrooveZones();
  newGame(2);
}, 50);

window.addEventListener("resize", () => {
  recalcSize();
  buildGrooveZones();
  if (state) render();
});
</script>
</body>
</html>
